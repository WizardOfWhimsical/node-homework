$kind: http-request
name: ManuelBulkTest
url: "{{HOST}}/api/tasks/bulk"
method: POST
body:
  type: json
  content: |-
    {
        "tasks": [
            { "title": "gotta be 3", "priority": "high" },
            { "title": "nothing happening 2", "priority": "medium" },
            { "title": "Ok, I calming down 4 1/5", "priority": "low" }
        ]
    }
scripts:
  - type: beforeRequest
    code: |
      // Sends a login request to trigger your server's global variable assignment
      pm.sendRequest({
          url: "{{HOST}}/api/users/logon",
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
              mode: 'raw',
              raw: JSON.stringify({
                  email: pm.globals.get("userManuelEmail"),
                  password: pm.globals.get("password")
              })
          }
      }, function (err, res) {
          if (err) {
              console.log("Pre-request login failed: ", err);
          } else {
              console.log("Server global variable updated for user1");
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.sendRequest({
          url: "{{HOST}}/api/users/logoff",
          method: 'DELETE',
      }, (err, res) => {
          if (err) {
              console.log("Post-res logoff: ", err);
          } else {
              console.log("Server global variable is null");
          }
      });
    language: text/javascript
