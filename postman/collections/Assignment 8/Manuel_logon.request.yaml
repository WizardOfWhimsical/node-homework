$kind: http-request
name: Manuel_logon
url: "{{HOST}}/api/users/logon"
method: POST
body:
  type: json
  content: |-
    {
        "email":"{{userManuelEmail}}",
        "password":"{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login success code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      const payload = pm.response.json()
      pm.globals.set("csrfToken", payload.csrfToken);
    language: text/javascript
