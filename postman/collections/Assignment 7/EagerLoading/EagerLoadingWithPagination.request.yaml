$kind: http-request
name: EagerLoadingWithPagination
url: "{{HOST}}/api/tasks/"
method: GET
scripts:
  - type: afterResponse
    code: >
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });



      // try {
          const jsonData = pm.response.json();

          pm.test("Response contains tasks and pagination", function () {
              pm.expect(jsonData).to.have.property("tasks");
              pm.expect(jsonData).to.have.property("pagination");
          });

          pm.test("Tasks include eager-loaded User info", function () {
              if (jsonData.tasks.length > 0) {
                  const task = jsonData.tasks[0];
                  pm.expect(task).to.have.property("User");
                  pm.expect(task.User).to.have.property("name");
                  pm.expect(task.User.name).to.eql("Buddy");
              }
          });

          pm.test("Pagination object has expected keys", function () {
              const pg = jsonData.pagination;
              pm.expect(pg).to.have.all.keys("page", "limit", "total", "pages", "hasNext", "hasPrev");
          });

      // } catch (e) {

      //     console.log("Parsing error or empty response encountered:",
      e.message);

      // }
    language: text/javascript
order: 1779336687395
