$kind: http-request
name: RegisterUser1
url: "{{HOST}}/api/users/register"
method: POST
body:
  type: json
  content: |
    {
      "email": "{{uniqueEmail1}}",
      "name": "Buddy",
      "password": "Pa$$word20"
    }
scripts:
  - type: beforeRequest
    code: |
      pm.collectionVariables.set("uniqueEmail1", `buddy@sample.com`);
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      const jsonData = pm.response.json();

      pm.test("User and welcome tasks are defined", function () {
          pm.expect(jsonData.user).to.exist;
          pm.expect(jsonData.welcomeTasks).to.exist;
          pm.expect(jsonData.welcomeTasks).to.have.lengthOf(3);
          pm.expect(jsonData.transactionStatus).to.eql("success");
      });

      pm.test("Welcome tasks have the expected titles", function () {
          const titles = jsonData.welcomeTasks.map(task => task.title);
          pm.expect(titles).to.include("Complete your profile");
          pm.expect(titles).to.include("Add your first task");
          pm.expect(titles).to.include("Explore the app");
      });

      // Captures the live database ID of the created user
      pm.collectionVariables.set("userId1", jsonData.user.id);
    language: text/javascript
order: 1779246066703
