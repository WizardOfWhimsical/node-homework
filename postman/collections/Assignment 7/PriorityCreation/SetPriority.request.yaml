$kind: http-request
name: SetPriority
url: "{{HOST}}/api/tasks"
method: POST
body:
  type: json
  content: |-
    {
      "title": "first task",
      "priority": "high"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      const jsonData = pm.response.json();

      pm.test("Task properties match expected inputs", function () {
          pm.expect(jsonData.title).to.eql("first task");
          pm.expect(jsonData.priority).to.eql("high");
          pm.expect(jsonData.isCompleted).to.eql(false);
      });

      // Saves the task ID if you need to update or delete it later
      // if (jsonData.id) {
          pm.collectionVariables.set("saveTaskId", jsonData.id);
      // }
    language: text/javascript
order: 1779247385702
